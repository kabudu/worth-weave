version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # age 0.12 unconditionally depends on p256 and crypto-bigint 0.5, which is
      # affected by RUSTSEC-2026-0387. Keep the 0.11.5 pin until a patched line exists.
      - dependency-name: age
        versions: [">=0.12.0"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.63 supports TypeScript <6.1 and crashes on 7.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
